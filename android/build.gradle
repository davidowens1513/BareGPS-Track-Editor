// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Keep generated artifacts outside a synced Documents folder when requested.
// Sync clients can otherwise duplicate .class files during incremental builds.
if (System.getenv('BAREGPS_ANDROID_BUILD_DIR')) {
    allprojects {
        layout.buildDirectory = file("${System.getenv('BAREGPS_ANDROID_BUILD_DIR')}/${project.name}")
    }
}
